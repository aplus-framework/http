services:
  package:
    image: registry.gitlab.com/aplus-framework/images/package:6
    container_name: package-http
    working_dir: /package
    volumes:
      - .:/package
    tty: true
  package-latest:
    image: registry.gitlab.com/aplus-framework/images/package:latest
    container_name: package-http-latest
    working_dir: /package
    volumes:
      - .:/package
    tty: true
